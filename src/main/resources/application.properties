
spring.config.import=optional:dotenv:.env

spring.application.name=SmartShop

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartshop}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jjwt.secret=${JWT_SECRET:Xk7v2Pm9Qw3Rt5Yh8Nj1Zx4Cv6Bn0Mp2Lk5Fg8Hd3Ja7Sw9Qt1Xe4Rv6Yu8Io0Pa2Sd5Fg7Hj9Kl}
spring.jjwt.expiration=3600000 
spring.jjwt.refresh-expiration=86400000 
